name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Tag push: build and publish to a GitHub Release (what the app auto-updates from).
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Manual run: build only, upload as a downloadable artifact.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDisplay-installer
          path: dist/*.exe
